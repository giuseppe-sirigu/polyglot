name: Release core

# Same pattern as release.yml, kept as a fully separate workflow so it can never
# interfere with @usepolyglot/cli's release path. Publishing @usepolyglot/core is a
# deliberate, manual act: bump its version locally (a changeset scoped to
# packages/core), commit, then push a matching `core-vX.Y.Z` tag - distinct from
# cli's plain `vX.Y.Z` tags, since the two packages version independently.
#
# Auth is npm trusted publishing (OIDC): no token, no secret. It needs its own
# Trusted Publisher configured on the npmjs.com package page for @usepolyglot/core
# (repo `giuseppe-sirigu/polyglot`, workflow `release-core.yml`), which means the
# package must already exist - the *first* publish is done by hand (see
# CONTRIBUTING.md -> Releasing).
on:
  push:
    tags:
      - "core-v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Gated by the `release` environment: a manual approval, `core-v*` tags only.
    # This name must match the "Environment" field in the npm Trusted Publisher
    # config (or both must be blank) - a mismatch makes the OIDC exchange fail.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url:` - it makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token that placeholder blocks
      # the OIDC fallback.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1.
      - run: |
          npm install -g npm@latest
          hash -r
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches @usepolyglot/core's version
        run: |
          TAG="${GITHUB_REF_NAME#core-v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag core-v$TAG does not match packages/core/package.json version $PKG. Run 'pnpm changeset:version' and retag."
            exit 1
          fi

      - run: pnpm --filter @usepolyglot/core build
      - run: pnpm --filter @usepolyglot/core typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: "Pack"
        run: pnpm --filter @usepolyglot/core pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish "$RUNNER_TEMP"/usepolyglot-core-*.tgz --provenance --access public

      - name: npm debug log (on failure)
        if: failure()
        run: for f in ~/.npm/_logs/*.log; do echo "=== $f ==="; cat "$f"; done
