name: Release

# Publishing is a deliberate, manual act: bump the version locally
# (`pnpm changeset:version`), commit, then push a matching `vX.Y.Z` tag. That tag —
# and nothing else — triggers this workflow, which re-runs the full check suite and
# then publishes `@usepolyglot/cli` to npm.
#
# Auth is npm trusted publishing (OIDC): no token, no secret. It needs a Trusted
# Publisher configured on the npmjs.com package page (repo `giuseppe-sirigu/polyglot`,
# workflow `release.yml`), which means the package must already exist — the *first*
# publish is done by hand (see CONTRIBUTING.md → Releasing).
#
# pnpm packs the tarball (it resolves the `workspace:` devDependency); npm publishes
# that tarball as-is (preserving the executable bit on dist/main.js, so the `bin`
# entry survives). pnpm's own publish doesn't do OIDC yet, hence the two-tool split.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Gated by the `release` environment: a manual approval, and `v*` tags only.
    # This name must match the "Environment" field in the npm Trusted Publisher config
    # (or both must be blank) — a mismatch makes the OIDC exchange fail.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url:` — it makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no token that placeholder blocks the
      # OIDC fallback.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1.
      - run: |
          npm install -g npm@latest
          hash -r
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches @usepolyglot/cli's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/cli/package.json version $PKG. Run 'pnpm changeset:version' and retag."
            exit 1
          fi

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: "Pack (pnpm resolves the workspace: devDependency)"
        run: pnpm --filter @usepolyglot/cli pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish "$RUNNER_TEMP"/usepolyglot-cli-*.tgz --provenance --access public

      - name: npm debug log (on failure)
        if: failure()
        run: for f in ~/.npm/_logs/*.log; do echo "=== $f ==="; cat "$f"; done
