name: Release

# Publishing is a deliberate, manual act: bump the version locally
# (`pnpm changeset:version`), commit, then push a matching `vX.Y.Z` tag. That tag —
# and nothing else — triggers this workflow, which re-runs the full check suite and
# then publishes `@usepolyglot/cli` to npm.
#
# Auth is npm trusted publishing (OIDC): no token, no secret. It needs a Trusted
# Publisher configured on the npmjs.com package page pointing at
# `giuseppe-sirigu/polyglot` + this workflow — which means the package must already
# exist, so the *first* publish is done by hand (see CONTRIBUTING.md → Releasing).
#
# pnpm packs the package (it resolves the `workspace:` devDependency); we unpack that
# tarball and run `npm publish` from the resulting directory — npm's OIDC exchange only
# kicks in for a directory publish, not `npm publish <file.tgz>`. (pnpm's own publish
# doesn't do OIDC yet, hence the two-tool split.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # NB: do NOT set `registry-url` here. It makes setup-node write an .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}`; with no token set that placeholder stays literal
      # and npm tries (and fails) token auth instead of falling through to OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older line.
      - run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches @usepolyglot/cli's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/cli/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match packages/cli/package.json version $PKG. Run 'pnpm changeset:version' and retag."
            exit 1
          fi

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: "Pack & unpack (pnpm resolves the workspace: devDependency)"
        run: |
          pnpm --filter @usepolyglot/cli pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf "$RUNNER_TEMP"/usepolyglot-cli-*.tgz -C "$RUNNER_TEMP/pkg" --strip-components=1
          cat "$RUNNER_TEMP/pkg/package.json"

      - name: Publish to npm (OIDC trusted publishing)
        working-directory: ${{ runner.temp }}/pkg
        run: npm publish --provenance --access public
